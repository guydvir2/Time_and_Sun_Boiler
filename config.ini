# Harmless defaults only. YOUR values (location, addresses, topics) are set in the app and saved to
# settings.json (git-ignored). Secrets are never in a file: HA_TOKEN, MQTT_PASSWORD, DASHBOARD_PASSWORD
# come from the server's environment (boiler.env, see boiler.env.example).

[homeassistant]
ip =
port = 8123

BOILER_1ST_ON_ENTITY_ID = input_number.boiler_duration_helper
BOILER_2ND_ON_ENTITY_ID = input_number.boiler_duration_helper_2nd
RUN_SCRIPT_1ST_START_BOILER_ENTITY_ID = start_waterheater_using_ui
RUN_SCRIPT_2ND_START_BOILER_ENTITY_ID = Start__2ND_WaterHeater_Using_UI

[location]
latitude =
longitude =

[weather]
weather_url = https://api.open-meteo.com/v1/forecast

[parameters]
SAVE_DATA = True
SLEEP_MINUTES = 15
READ_DATA_FROM_FILE = False
debug_mode_ignore_update_time = False
DAYS_BACK_WEATHER_DATA = 0
# 0 = today, 1 = yesterday, 2 = the day before yesterday

[output]
# Ordered list. The next driver is only tried if the previous one failed.
# Options: homeassistant | mqtt_tasmota | dryrun
drivers =

[mqtt]
host =
port = 1883
username =
# password: env var MQTT_PASSWORD only

[tasmota]
# The device's MQTT topic (Tasmota %topic%), e.g. boiler  ->  cmnd/boiler/Power
topic =
# Copy from the device: Configuration > Configure MQTT > Full Topic.
# Tasmota default is %prefix%/%topic%/  (cmnd/<topic>/Power). If the command word comes
# AFTER the topic (<topic>/cmnd/Power) use:  full_topic = %topic%/%prefix%/
full_topic = %prefix%/%topic%/
relay = 1
confirm = True
confirm_timeout = 10

[power]
# Listens to the plug's energy readings (same MQTT topic as the relay). Listen + log only: changes no decision.
enabled = True
# At or above this many watts the element counts as heating
on_watts = 100
# Multiplier for the plug's Power reading. 10 = the plug reports voltage (so power) 10x too low
# while current is right. Use 1 for a plug that reads correctly.
scale = 10
# The sensor follows the relay with a delay: after switching ON/OFF it takes about this long for the current
# to show up / drop to 0. Inside that time the app expects the lag, raises no alarm, and does not count it.
settle_seconds = 60

[dashboard]
# Read-only status page, runs inside the service. Open http://<vm-ip>:8080
enabled = True
# 0.0.0.0 = reachable from your LAN (phone); 127.0.0.1 = this machine only
host = 0.0.0.0
port = 8080
# Manual Run/Stop buttons need a password: set env DASHBOARD_PASSWORD (never in this file).
max_manual_minutes = 180
